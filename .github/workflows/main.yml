name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:          # allows manual trigger from Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Gradle / Android SDK) ───────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js (required by Cordova CLI) ────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Android SDK command-line tools ───────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install Cordova globally ──────────────────────────────────────
      - name: Install Cordova CLI
        run: npm install -g cordova@12

      # ── 6. Install project deps ──────────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 7. Add Android platform ──────────────────────────────────────────
      - name: Add Android platform
        run: cordova platform add android@13

      # ── 8. Build debug APK ───────────────────────────────────────────────
      - name: Build APK (debug)
        run: cordova build android --debug

      # ── 9. Upload APK as downloadable artifact ───────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamBills-KLS-GIT-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
